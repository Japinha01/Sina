/* ---------- cartas ---------- */
function rollRarity(min){
  const L = effLuck();
  const w = [60, 26+L*0.3, 10+L*0.2, 3+L*0.1];
  for(let i=0;i<min;i++) w[i]=0;
  const s = w.reduce((a,b)=>a+b,0);
  let r = Math.random()*s;
  for(let i=0;i<4;i++){ r-=w[i]; if(r<=0) return i; }
  return 3;
}
function makeCard(kind, id, minRar){
  if(kind==='evo'){
    const w = G.weapons.find(x=>x.id===id), W_ = WEAPONS[id];
    tip('evo');
    return {kind, id, rar:3, tag:W_.tag, label:tr('lbl_evo'), title:W_.evo.nome, desc:`${W_.nome} + ${JOKERS[W_.evo.joker].nome}. ${W_.evo.desc}`,
      apply:()=>{ w.evo = true; SAVE.seen['e:'+id] = true; persist(); banner(W_.evo.nome); sfx.evo(); G.shake = 10; Portal.happy(); }};
  }
  if(kind==='up'){
    const w = G.weapons.find(x=>x.id===id), W_ = WEAPONS[id];
    const rar = rollRarity(minRar), to = Math.min(WMAX, w.lvl + (rar>=2?2:1));
    return {kind, id, rar, tag:W_.tag, label:tr('lbl_up'), title:tr('up_title', {n:W_.nome, l:to}), desc:diffText(id,w.lvl,to), apply:()=>{ w.lvl = to; }};
  }
  if(kind==='new'){
    const W_ = WEAPONS[id], rar = rollRarity(minRar), l = rar>=2?2:1;
    return {kind, id, rar, tag:W_.tag, label:tr('lbl_new'), title:W_.nome, desc:W_.desc + (l>1?tr('new_lvl2'):''), apply:()=>{ G.weapons.push({id, lvl:l, t:0.2, evo:false}); }};
  }
  if(kind==='joker'){
    const j = JOKERS[id];
    return {kind, id, rar:j.rar, tag:j.tag, label:tr('lbl_joker'), title:j.nome, desc:j.d, apply:()=>{ G.jokers.push(id); J[id]=true; onJoker(id); }};
  }
  const b = BLESS.find(x=>x.id===id);
  const rar = rollRarity(Math.max(minRar, b.min||0)), m = RAR[rar].m;
  return {kind:'bless', id, rar, tag:null, label:tr('lbl_bless'), title:b.nome, desc:b.d(m), apply:()=>b.f(P,m)};
}
function onJoker(id){
  if(id==='vidro'){ P.maxHp = Math.max(10, Math.floor(P.maxHp/2)); P.hp = Math.min(P.hp, P.maxHp); }
  if(id==='coracao'){ P.maxHp += 40; P.hp += 40; P.armor += 2; }
  if(id==='trevo'){ P.luck += 25; P.freeRerolls += 1; }
  if(id==='tambor'){ P.cdr = Math.min(0.6, P.cdr+0.1); P.area += 0.1; }
}
function genCards(minRar){
  const pool = [];
  const luckBoost = 1 + effLuck()/60;
  for(const w of G.weapons){
    const W_ = WEAPONS[w.id];
    if(w.lvl < WMAX) pool.push({kind:'up', id:w.id, w:3.2});
    else if(!w.evo && J[W_.evo.joker]) pool.push({kind:'evo', id:w.id, w:8});
  }
  if(G.weapons.length < 6)
    for(const id in WEAPONS) if(!G.weapons.some(w=>w.id===id)) pool.push({kind:'new', id, w:1.1});
  if(G.jokers.length < maxJokers())
    for(const id in JOKERS){
      if(J[id]) continue;
      const r = JOKERS[id].rar;
      if(r < minRar-1) continue;
      let wt = [1.0,0.75,0.42,0.18][r]*(r>=2?luckBoost:1);
      // coringas que evoluem uma arma que você já tem aparecem mais
      if(G.weapons.some(w=>WEAPONS[w.id].evo.joker===id && !w.evo)) wt *= 1.8;
      pool.push({kind:'joker', id, w:wt});
    }
  for(const b of BLESS){
    if(b.id==='multi' && P.extraN>=3) continue;
    if(b.id==='cura' && P.hp >= P.maxHp*0.9) continue;
    pool.push({kind:'bless', id:b.id, w: b.id==='multi' ? 0.25 : 0.4});
  }
  const out = [];
  const n = cardCount();
  // evolução disponível sempre aparece
  const evo = pool.find(o=>o.kind==='evo');
  if(evo){ pool.splice(pool.indexOf(evo),1); out.push(makeCard('evo', evo.id, minRar)); }
  while(out.length<n && pool.length){
    const o = pickWeighted(pool);
    pool.splice(pool.indexOf(o),1);
    out.push(makeCard(o.kind, o.id, minRar));
  }
  for(const c of out){
    if(c.kind==='new' || c.kind==='up') SAVE.seen['w:'+c.id] = true;
    if(c.kind==='joker') SAVE.seen['j:'+c.id] = true;
  }
  return out;
}
function openLevel(minRar, chest){
  G.mode = 'level';
  G.offerMin = minRar; G.offerChest = chest;
  if(!chest){
    if(J.trevo) P.freeRerolls += 1;
  }
  G.offer = genCards(minRar);
  G.levelAt = performance.now();
  $('#levelTitulo').textContent = chest ? tr(minRar>=3 ? 'leg_title' : 'chest_title') : tr('lvl_title', {n:G.lvl - G.pending});
  renderCards();
  showOnly('level');
  if(chest) sfx.card(); else sfx.level();
}
function renderCards(){
  const box = $('#cards'); box.innerHTML = '';
  G.offer.forEach((c,i)=>{
    const T = c.tag ? TAGS[c.tag] : null;
    const sig = c.kind==='evo' ? '★' : T ? T.ico : c.kind==='bless' ? '✦' : '★';
    const b = document.createElement('button');
    b.className = 'card r'+c.rar + (c.kind==='evo'?' evo':'');
    b.style.setProperty('--tc', c.kind==='evo' ? '#f2b544' : T ? T.cor : (c.kind==='joker' ? '#f2b544' : '#ecdfc6'));
    b.style.animationDelay = (i*0.08)+'s';
    b.innerHTML = `<div class="topo"><span>${c.label}</span><span class="rar">${RAR[c.rar].n}</span></div>
      <div class="sigilo" aria-hidden="true">${sig}</div>
      <div class="corpo"><h3>${c.title}</h3><p>${c.desc}</p>${T && c.kind!=='evo' ? `<div class="sin">${tr('syn_counts', {t:T.nome.toLowerCase()})}</div>` : ''}</div>
      <kbd>${i+1}</kbd>`;
    b.addEventListener('click', ()=>{ if(performance.now() - G.levelAt >= 350) chooseCard(i); });
    box.appendChild(b);
  });
  const rb = $('#btnReroll');
  if(P.freeRerolls>0){ rb.textContent = tr('reroll_free', {n:P.freeRerolls}); rb.disabled = false; }
  else { rb.textContent = tr('reroll_cost', {p:G.rerollCost}); rb.disabled = G.coins < G.rerollCost; }
  $('#btnSkip').hidden = G.offerChest;
  const first = box.querySelector('.card'); if(first && !touchUI) first.focus({preventScroll:true});
}
function chooseCard(i){
  if(G.mode!=='level' || !G.offer[i]) return;
  const c = G.offer[i];
  c.apply();
  if(c.kind!=='evo') sfx.card();
  recalcSyn();
  if(G.tut && G.tut.step===2) G.tut.flag = true;
  resumePlay();
}
function reroll(){
  if(G.mode!=='level') return;
  if(P.freeRerolls>0) P.freeRerolls--;
  else if(G.coins >= G.rerollCost){ G.coins -= G.rerollCost; G.rerollCost += 2; }
  else return;
  G.offer = genCards(G.offerMin);
  G.levelAt = performance.now();
  renderCards();
  tone(500,0.08,'triangle',0.04,0.7);
}
function skipCards(){
  if(G.mode!=='level' || G.offerChest) return;
  G.coins += 5; sfx.coin();
  resumePlay();
}
function resumePlay(){
  G.mode = 'play'; showOnly(null); last = 0;
  $('#coins').textContent = G.coins;
  G.dirty = true;
}

/* ---------- morte, vitória e fim ---------- */
function die(){
  if(P.revives>0){ P.revives--; revive(); banner(tr('phoenix')); return; }
  endRun(false);
}
function revive(){
  P.hp = Math.round(P.maxHp*0.6); P.inv = 2.5;
  for(const e of G.enemies) if(!e.boss && Math.hypot(e.x-P.x,e.y-P.y) < 340){ e.dead = true; burst(e.x,e.y,3,e.cor); }
  G.eproj = [];
  G.fx.push({kind:'ring', x:P.x, y:P.y, r:340, life:0.5, max:0.5, cor:'#f2b544'});
  G.shake = 16;
  tone(260,0.6,'triangle',0.06,3);
}
function soulsFor(){ return Math.floor((G.kills/400 + G.time/6 + G.bossKills*30 + (G.won?150:0)) * P.soulMult * (1 + G.curse*0.3) * (1 + Math.min(0.5, (G.maxHeat-1)*0.03))); }
function showWin(){
  if(G.mode==='dead') return;
  G.mode = 'win'; G.winShown = true;
  const novo = Math.min(5, G.curse+1);
  const liberou = novo > SAVE.maxCurse;
  SAVE.maxCurse = Math.max(SAVE.maxCurse, novo);
  persist();
  checkMissions();
  Portal.happy();
  $('#winTxt').textContent = (G.curse ? tr('win_txt_c', {t:fmtTime(G.time), c:G.curse}) : tr('win_txt', {t:fmtTime(G.time)})) +
    (liberou ? tr('win_unlock', {n:novo}) : '') + tr('win_inf');
  showOnly('win');
  sfx.evo();
}
function endRun(quit){
  checkMissions();
  G.mode = 'dead'; G.quit = quit;
  const s = soulsFor();
  SAVE.almas += s; G.soulsGiven = s;
  const novoRecorde = G.time > SAVE.best.time;
  if(novoRecorde) SAVE.best.time = G.time;
  if(G.kills > SAVE.best.kills) SAVE.best.kills = G.kills;
  if(!G.recorded){
    G.recorded = true;
    SAVE.runs.push({t:Math.floor(G.time), k:G.kills, l:G.lvl, c:G.char, m:G.curse, w:G.won?1:0, d:Date.now()});
    SAVE.runs.sort((a,b)=>b.t-a.t || b.k-a.k);
    SAVE.runs = SAVE.runs.slice(0,10);
  }
  if(G.tut && !G.tut.done) tutEnd();
  persist();
  $('#deadTitulo').textContent = tr(G.won ? 'dead_title_win' : 'dead_title');
  $('#deadStats').innerHTML = `
    <div><dt>${tr('th_time')}</dt><dd>${fmtTime(G.time)}</dd></div>
    <div><dt>${tr('th_lvl')}</dt><dd>${G.lvl}</dd></div>
    <div><dt>${tr('th_kills')}</dt><dd>${fmtN(G.kills)}</dd></div>
    <div><dt>${tr('th_bosses')}</dt><dd>${G.bossKills}</dd></div>`;
  G.recordFlag = novoRecorde && G.time>30;
  updateGanho();
  $('#btnReviver').hidden = quit || G.adUsed || G.won;
  $('#btnDobrar').hidden = G.doubled || s < 5;
  showOnly('dead');
  tone(200,0.8,'sawtooth',0.05,0.3,0.4);
}
function updateGanho(){
  $('#deadGanho').innerHTML = tr('gain', {n:G.soulsGiven}) + (G.recordFlag && !G.doubled ? tr('new_record') : '');
}
function reviveWithAd(){
  if(G.adUsed || G.quit || G.doubled) return;
  Portal.rewarded(()=>{
    G.adUsed = true;
    SAVE.almas = Math.max(0, SAVE.almas - G.soulsGiven); G.soulsGiven = 0;
    SAVE.runs = SAVE.runs.filter(r=>!(r.t===Math.floor(G.time) && r.k===G.kills));
    G.recorded = false;
    persist();
    revive();
    resumePlay();
  }, ()=>toast(tr('ad_fail')));
}
function doubleWithAd(){
  if(G.doubled) return;
  Portal.rewarded(()=>{
    G.doubled = true;
    SAVE.almas += G.soulsGiven; G.soulsGiven *= 2; persist();
    updateGanho();
    $('#btnDobrar').hidden = true;
    $('#btnReviver').hidden = true;
    sfx.coin();
  }, ()=>toast(tr('ad_fail')));
}
function goMenu(){
  if(G) G.mode = 'menu';
  $('#hud').hidden = true;
  $('#tut').hidden = true;
  $('#menuAlmas').innerHTML = tr('menu_souls', {n:SAVE.almas}) + (SAVE.best.time>0 ? tr('menu_record', {t:fmtTime(SAVE.best.time), k:fmtN(SAVE.best.kills)}) : '');
  renderCurse();
  showOnly('menu');
}
function renderCurse(){
  $('#curseSel').hidden = SAVE.maxCurse < 1;
  SAVE.curse = clamp(SAVE.curse, 0, SAVE.maxCurse);
  const c = SAVE.curse;
  $('#curseTxt').innerHTML = c === 0 ? tr('curse_none') : tr('curse_desc', {c, h:c*25, d:c*15, s:c*30});
  $('#curseMenos').disabled = c<=0;
  $('#curseMais').disabled = c>=SAVE.maxCurse;
}

/* ---------- pausa ---------- */
function pause(){
  if(!G || G.mode!=='play') return;
  G.mode = 'pause';
  let h = '';
  if(G.trial) h += `<div>${tr('pause_trial', {n:TRIALS[G.trial].nome, d:TRIALS[G.trial].d, r:lowerFirst(TRIALS[G.trial].rw)})}</div>`;
  for(const w of G.weapons){
    const W_=WEAPONS[w.id];
    let extra = '';
    if(!w.evo && SAVE.seen['e:'+w.id]) extra = tr('evo_hint', {l:WMAX, j:JOKERS[W_.evo.joker].nome});
    h += `<div><b>${wname(w)}${w.evo?'':tr('lvl_suffix', {l:w.lvl})}.</b> ${w.evo?W_.evo.desc:W_.desc}${extra}</div>`;
  }
  for(const id of G.jokers){ const j=JOKERS[id]; h += `<div><b>${j.nome}.</b> ${j.d}</div>`; }
  for(const id of G.tarots) h += `<div><b>${TAROTS[id].nome}.</b> ${TAROTS[id].d}</div>`;
  h += `<div>${tr('stats_line', {d:pct(P.dmg*(J.vidro?2:1)), c:pct(effCrit()), r:pct(1-cdMult()), a:pct(P.area), ar:P.armor, s:Math.round(effLuck()), b:BIOMES[G.biome].nome})}</div>`;
  $('#pauseBuild').innerHTML = h;
  showOnly('pause');
}
function unpause(){ if(G && G.mode==='pause') resumePlay(); }

/* ---------- relicário ---------- */
function renderReli(){
  $('#reliAlmas').innerHTML = tr('reli_souls', {n:SAVE.almas});
  let h = '';
  for(const id in CHARS){
    const c = CHARS[id], tem = SAVE.chars[id], sel = SAVE.char===id;
    const btn = sel ? `<button class="btn peq" disabled>${tr('selected')}</button>`
      : tem ? `<button class="btn peq" data-sel="${id}">${tr('choose')}</button>`
      : `<button class="btn peq" data-buyc="${id}" ${SAVE.almas<c.custo?'disabled':''}>${tr('unlock', {p:c.custo})}</button>`;
    h += `<div class="linha"><div><div class="nome">${c.nome}</div><div class="desc">${c.desc}</div></div>${btn}</div>`;
  }
  $('#listaChars').innerHTML = h;
  h = '';
  for(const m of META){
    const l = SAVE.up[m.id]||0, max = l>=m.max, cost = m.custo(l);
    let pips = ''; for(let i=0;i<m.max;i++) pips += `<span class="pip ${i<l?'on':''}"></span>`;
    const btn = max ? `<button class="btn peq" disabled>${tr('completed')}</button>`
      : `<button class="btn peq" data-buym="${m.id}" ${SAVE.almas<cost?'disabled':''}>${tr('buy_souls', {p:cost})}</button>`;
    h += `<div class="linha"><div><div class="nome">${m.nome}</div><div class="desc">${m.desc}</div><div class="pips">${pips}</div></div>${btn}</div>`;
  }
  $('#listaMeta').innerHTML = h;
}
$('#reli').addEventListener('click', ev=>{
  const b = ev.target.closest('button'); if(!b || b.disabled) return;
  if(b.dataset.sel){ SAVE.char = b.dataset.sel; }
  else if(b.dataset.buyc){ const c=CHARS[b.dataset.buyc]; if(SAVE.almas>=c.custo){ SAVE.almas-=c.custo; SAVE.chars[b.dataset.buyc]=true; SAVE.char=b.dataset.buyc; audioOn(); sfx.level(); } }
  else if(b.dataset.buym){ const m=META.find(x=>x.id===b.dataset.buym), l=SAVE.up[m.id]||0; if(l<m.max && SAVE.almas>=m.custo(l)){ SAVE.almas-=m.custo(l); SAVE.up[m.id]=l+1; audioOn(); sfx.coin(); } }
  else return;
  persist(); renderReli();
});

/* ---------- grimório ---------- */
let abaGrim = 'missoes';
function renderGrim(){
  document.querySelectorAll('#grim .abas button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.aba===abaGrim));
  let h = '';
  if(abaGrim==='missoes'){
    const feitas = MISSIONS.filter(m=>SAVE.missions[m.id]).length;
    h += `<p class="desc">${tr('miss_count', {a:feitas, b:MISSIONS.length})}</p>`;
    for(const m of MISSIONS){
      const ok = SAVE.missions[m.id];
      h += `<div class="missao ${ok?'feita':''}"><span class="ok">${ok?'✓':''}</span><span class="nome">${m.nome}</span><span class="rec">${tr('souls_plus', {n:m.r})}</span></div>`;
    }
  } else if(abaGrim==='armas'){
    h += '<div class="grade">';
    for(const id in WEAPONS){
      const W_ = WEAPONS[id], T = TAGS[W_.tag], vista = SAVE.seen['w:'+id], evo = SAVE.seen['e:'+id];
      h += `<div class="verbete ${vista?'':'oculto'}" style="--c:${T.cor}">
        <div class="nome">${vista ? T.ico+' '+W_.nome : '???'}</div>
        <div class="desc">${vista ? W_.desc : tr('not_found')}</div>
        <div class="evo">${evo ? tr('evo_recipe', {e:W_.evo.nome, l:WMAX, j:JOKERS[W_.evo.joker].nome}) : tr('evo_unknown')}</div></div>`;
    }
    h += `</div><p class="desc" style="margin-top:.8rem">${tr('grim_tip')}</p>`;
  } else if(abaGrim==='coringas'){
    const vistos = Object.keys(JOKERS).filter(id=>SAVE.seen['j:'+id]).length;
    h += `<p class="desc">${tr('jokers_found', {a:vistos, b:Object.keys(JOKERS).length})}</p><div class="grade">`;
    for(const id in JOKERS){
      const j = JOKERS[id], v = SAVE.seen['j:'+id], T = j.tag ? TAGS[j.tag] : null;
      h += `<div class="verbete ${v?'':'oculto'}" style="--c:${['#b3a78f','#5fa8e8','#b46be0','#f2b544'][j.rar]}">
        <div class="nome">${v ? j.nome : '???'}</div>
        <div class="desc">${v ? j.d : RAR[j.rar].n}</div>
        ${v && T ? `<div class="desc" style="color:${T.cor}">${T.ico} ${T.nome}</div>` : ''}</div>`;
    }
    h += '</div>';
  } else {
    if(!SAVE.runs.length) h += `<p class="desc">${tr('no_runs')}</p>`;
    else {
      h += `<div class="tabela-wrap"><table class="rank"><thead><tr><th>#</th><th>${tr('th_time')}</th><th>${tr('th_kills')}</th><th>${tr('th_lvl')}</th><th>${tr('th_char')}</th><th>${tr('th_curse')}</th><th></th></tr></thead><tbody>`;
      SAVE.runs.forEach((r,i)=>{
        h += `<tr><td>${i+1}</td><td>${fmtTime(r.t)}</td><td>${fmtN(r.k)}</td><td>${r.l}</td><td>${CHARS[r.c]?CHARS[r.c].nome:'?'}</td><td>${r.m||'-'}</td><td>${r.w?tr('victory'):''}</td></tr>`;
      });
      h += '</tbody></table></div>';
    }
  }
  $('#grimConteudo').innerHTML = h;
}
$('#grim .abas').addEventListener('click', ev=>{
  const b = ev.target.closest('button'); if(!b) return;
  abaGrim = b.dataset.aba; renderGrim();
});

/* ---------- telas ---------- */
const SCREENS = ['menu','reli','grim','opts','level','shop','trial','pause','win','dead'];
function showOnly(id){ for(const s of SCREENS) $('#'+s).hidden = s!==id; if(id){ joyEnd(); $('#banner').classList.remove('on'); } document.body.classList.toggle('sobreposto', !!id); if(G) tutShow(); tipContexto(); }
$('#btnJogar').onclick = startRun;
$('#reliJogar').onclick = startRun;
$('#btnReli').onclick = ()=>{ renderReli(); showOnly('reli'); };
$('#btnGrim').onclick = ()=>{ renderGrim(); showOnly('grim'); };
$('#grimVoltar').onclick = goMenu;
$('#btnDeadReli').onclick = ()=>{ if(G) G.mode='menu'; $('#hud').hidden=true; renderReli(); showOnly('reli'); };
$('#btnDeadMenu').onclick = goMenu;
$('#reliVoltar').onclick = goMenu;
$('#btnReroll').onclick = reroll;
$('#btnSkip').onclick = skipCards;
$('#btnPause').onclick = pause;
$('#btnContinuar').onclick = unpause;
$('#btnDesistir').onclick = ()=>{ if(G && G.mode==='pause') endRun(true); };
$('#btnDeNovo').onclick = startRun;
$('#btnReviver').onclick = reviveWithAd;
$('#btnDobrar').onclick = doubleWithAd;
$('#btnInfinito').onclick = ()=>{ if(G && G.mode==='win') resumePlay(); };
$('#btnEncerrar').onclick = ()=>{ if(G && G.mode==='win') endRun(false); };
$('#curseMenos').onclick = ()=>{ SAVE.curse--; persist(); renderCurse(); };
$('#curseMais').onclick = ()=>{ SAVE.curse++; persist(); renderCurse(); };
function toggleMute(){ muted = !muted; applyVolumes(); $('#btnMute').textContent = muted ? '×' : '♪'; $('#btnMute').setAttribute('aria-label', tr(muted?'a_mute_off':'a_mute_on')); }
$('#btnMute').onclick = toggleMute;
$('#tar0').addEventListener('pointerdown', ev=>{ ev.preventDefault(); useTarot(0); });
$('#tar1').addEventListener('pointerdown', ev=>{ ev.preventDefault(); useTarot(1); });
$('#btnDash').addEventListener('pointerdown', ev=>{ ev.preventDefault(); audioOn(); dash(); });

/* ---------- entrada ---------- */
addEventListener('keydown', ev=>{
  keys[ev.code] = true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(ev.code)) ev.preventDefault();
  if(!G) return;
  if(ev.code==='Escape' || ev.code==='KeyP'){ if(G.mode==='play') pause(); else if(G.mode==='pause') unpause(); }
  if(ev.code==='KeyM') toggleMute();
  if(['Space','ShiftLeft','ShiftRight','KeyK'].includes(ev.code)) dash();
  if(ev.code==='KeyQ') useTarot(0);
  if(ev.code==='KeyE') useTarot(1);
  if(G.mode==='trial'){
    if(ev.repeat) return;
    if(ev.code==='Digit1'||ev.code==='Numpad1') chooseTrial(G.trialOffer[0]);
    if(ev.code==='Digit2'||ev.code==='Numpad2') chooseTrial(G.trialOffer[1]);
  }
  if(G.mode==='level'){
    const m = !ev.repeat && performance.now() - G.levelAt >= 350 && /^(?:Digit|Numpad)([1-5])$/.exec(ev.code);
    if(m) chooseCard(+m[1]-1);
    if(ev.code==='KeyR') reroll();
  }
});
addEventListener('keyup', ev=>{ keys[ev.code] = false; });
addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; pause(); });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) pause(); });

const joyEl = $('#joy'), joyKnob = joyEl.querySelector('i');
cv.addEventListener('pointerdown', ev=>{
  if(!G || G.mode!=='play' || joy.active) return;
  audioOn();
  joy.active = true; joy.id = ev.pointerId; joy.ox = ev.clientX; joy.oy = ev.clientY; joy.dx = joy.dy = 0;
  joyEl.style.left = ev.clientX+'px'; joyEl.style.top = ev.clientY+'px';
  joyKnob.style.transform = 'none';
  joyEl.hidden = false;
  try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
});
cv.addEventListener('pointermove', ev=>{
  if(!joy.active || ev.pointerId!==joy.id) return;
  let dx = ev.clientX-joy.ox, dy = ev.clientY-joy.oy;
  const d = Math.hypot(dx,dy), max = 44;
  if(d>max){ dx=dx/d*max; dy=dy/d*max; }
  joy.dx = dx/max; joy.dy = dy/max;
  if(d < 6){ joy.dx = joy.dy = 0; }
  joyKnob.style.transform = `translate(${dx}px,${dy}px)`;
});
function joyEnd(){ joy.active=false; joy.dx=joy.dy=0; joyEl.hidden=true; }
cv.addEventListener('pointerup', ev=>{ if(ev.pointerId===joy.id) joyEnd(); });
cv.addEventListener('pointercancel', ev=>{ if(ev.pointerId===joy.id) joyEnd(); });

/* ---------- opções ---------- */
let optReturn = 'menu', resetArmed = false, optMsg = '';
function openOpts(from){ optReturn = from; resetArmed = false; optMsg = ''; renderOpts(); showOnly('opts'); }
function segBtns(attr, items, cur){
  return items.map(([v,label]) => `<button data-${attr}="${v}" aria-pressed="${String(v)===String(cur)}">${label}</button>`).join('');
}
function renderOpts(){
  const o = SAVE.opt;
  $('#optConteudo').innerHTML = `
    <div class="opt"><label>${tr('o_lang')}</label><div class="seg">${segBtns('lang', Object.entries(LANGS), LANG)}</div></div>
    <div class="opt"><label for="volMus">${tr('o_music')}</label><input type="range" id="volMus" min="0" max="1" step="0.05" value="${o.music}"></div>
    <div class="opt"><label for="volSfx">${tr('o_sfx')}</label><input type="range" id="volSfx" min="0" max="1" step="0.05" value="${o.sfx}"></div>
    <div class="opt"><label>${tr('o_quality')}</label><div class="seg">${segBtns('q', ['auto','alta','media','baixa'].map(q=>[q, tr('q_'+q)]), o.quality)}</div></div>
    <div class="opt"><label>${tr('o_shake')}</label><div class="seg">${segBtns('shake', [[1,tr('on')],[0,tr('off')]], o.shake?1:0)}</div></div>
    <div class="opt"><label>${tr('o_nums')}</label><div class="seg">${segBtns('nums', [[1,tr('on')],[0,tr('off')]], o.nums?1:0)}</div></div>
    <div class="opt-acoes">
      <button class="btn peq" id="optTut">${tr('o_tut')}</button>
      ${optReturn==='menu' ? `<button class="btn peq perigo" id="optReset">${resetArmed ? tr('o_reset_confirm') : tr('o_reset')}</button>` : ''}
    </div>
    <p id="optMsg" role="status">${optMsg}</p>`;
}
$('#opts').addEventListener('click', ev=>{
  const b = ev.target.closest('button'); if(!b) return;
  const d = b.dataset, o = SAVE.opt;
  if(d.lang){ setLang(d.lang); }
  else if(d.q){ o.quality = d.q; applyQuality(); }
  else if(d.shake !== undefined){ o.shake = d.shake==='1'; }
  else if(d.nums !== undefined){ o.nums = d.nums==='1'; }
  else if(b.id==='optTut'){ o.tutorialDone = false; SAVE.tips = {}; optMsg = tr('o_tut_done'); }
  else if(b.id==='optReset'){
    if(!resetArmed){ resetArmed = true; }
    else {
      const keep = SAVE.opt, fresh = defaultSave();
      for(const k in fresh) SAVE[k] = fresh[k];
      SAVE.opt = keep; SAVE.opt.tutorialDone = false;
      resetArmed = false; optMsg = tr('o_reset_done');
    }
  } else if(b.id==='optVoltar'){ closeOpts(); return; }
  else return;
  persist(); renderOpts();
});
$('#opts').addEventListener('input', ev=>{
  if(ev.target.id==='volMus'){ SAVE.opt.music = +ev.target.value; applyVolumes(); }
  if(ev.target.id==='volSfx'){ SAVE.opt.sfx = +ev.target.value; applyVolumes(); }
});
$('#opts').addEventListener('change', ev=>{
  if(ev.target.id==='volSfx'){ audioOn(); tone(880,0.12,'triangle',0.05,1.2,0.3); }
  persist();
});
function closeOpts(){
  if(optReturn==='pause' && G && G.mode==='pause'){ G.mode = 'play'; G.dirty = true; G.hudT = 0; updateHud(0); pause(); }
  else goMenu();
}
$('#btnOpts').onclick = ()=>{ audioOn(); openOpts('menu'); };
$('#btnPauseOpts').onclick = ()=>openOpts('pause');
$('#tutPular').onclick = ()=>{ if(G && G.tut) tutEnd(); };

/* ---------- início ---------- */
LANG = SAVE.opt.lang || detectLang();
localizeAll();
applyStatic();
applyQuality();
Portal.init();
goMenu();
requestAnimationFrame(loop);

</script>
</body>
